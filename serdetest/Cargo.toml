[package]
name = "serdetest"
version = "0.1.0"
edition = "2024"

[dependencies]
lazy_static = "^1.4.0"
chrono = "^0.4.0"
bytes = "^0.5.3"
regex = "1"
num-bigint = "^0.4.3"
num-traits = "^0.2.5"
serde_json = "^1.0.42"
serde = { version = "^1.0", features = ["derive"] }
asn1obj_codegen = "^0.1.8"
asn1obj = {path = "../asn1obj"}

extargsparse_worker = "^0.2.4"
extargsparse_codegen = "^0.1.4"

log4rs = "^0.8.3"
log = "^0.4.8"
rand = "^0.8.5"
rand_core = "^0.6.4"

[target.'cfg(windows)'.dependencies.winapi]
version = "0.3"
features = ["winbase", "debugapi", "stringapiset", "winnls", "datetimeapi",
	"sysinfoapi", "wincred","combaseapi","errhandlingapi", "setupapi", "aclapi" , "accctrl"]
